{% extends "base.html" %}

{% block title %}Reset password — PubMed AI{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}?v={{ static_version }}">
{% endblock %}

{% block header %}
<h1>PubMed AI Search</h1>
<p>Reset your password</p>
{% endblock %}

{% block content %}
<div class="container">
  <div class="auth-card">
    <h1>Forgot password</h1>
    <div class="auth-error" id="auth-error"></div>
    <div class="auth-notice" id="auth-notice"></div>
    <form id="forgot-password-form">
      <div class="auth-field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>
      <button class="auth-submit" type="submit">Send reset link</button>
    </form>
    <p class="auth-switch"><a href="/login">Back to log in</a></p>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='auth.js') }}?v={{ static_version }}"></script>
{% endblock %}
