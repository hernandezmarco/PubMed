<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PubMed AI Search{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}?v={{ static_version }}">
  {% block extra_css %}{% endblock %}
</head>
<body>
<div id="progress-bar"></div>
<header>{% block header %}{% endblock %}</header>
{% block breadcrumb %}{% endblock %}
{% block content %}{% endblock %}
<footer>
  <p>&copy; 2026 Marco A. Hernandez, Digital Hammer LLC. Licensed under the
    <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener">AGPL v3</a>.</p>
</footer>
<script src="{{ url_for('static', filename='base.js') }}?v={{ static_version }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
